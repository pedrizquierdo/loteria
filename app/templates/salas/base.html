<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Salas · Lotería Mexicana en línea{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/salas.css') }}">
</head>
<body>
  <div class="papel-picado" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('salas.inicio') }}">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>Lotería Mexicana</span>
      </a>
      <nav class="site-nav" aria-label="Navegación de salas">
        <a href="{{ url_for('salas.crear') }}" class="nav-link">Crear sala</a>
        <a href="{{ url_for('salas.unirse') }}" class="nav-link nav-link-accent">Unirse</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Lotería Mexicana en línea · Salas en tiempo real para el aula</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/salas.js') }}" defer></script>
</body>
</html>
