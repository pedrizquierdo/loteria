<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panel del profesor · Lotería Mexicana en línea{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/panel.css') }}">
</head>
<body>
  <div class="papel-picado" aria-hidden="true"></div>
  <header class="panel-header">
    <div class="panel-container header-inner">
      <a class="brand" href="{{ url_for('panel.acceso') }}">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>Panel del profesor</span>
      </a>
      <nav class="panel-nav" aria-label="Navegación del panel">
        <a href="{{ url_for('panel.acceso') }}" class="nav-link">Mis partidas</a>
      </nav>
    </div>
  </header>

  <main class="panel-container panel-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="panel-footer">
    <div class="panel-container">
      <p>Lotería Mexicana en línea · Panel de control del profesor</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/panel.js') }}" defer></script>
</body>
</html>
