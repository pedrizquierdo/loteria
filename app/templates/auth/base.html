<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acceso · Lotería Mexicana en línea{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="papel-picado" aria-hidden="true"></div>
  <header class="auth-header">
    <div class="auth-container header-inner">
      <a class="brand" href="{{ url_for('auth.login') }}">
        <span class="brand-mark" aria-hidden="true">★</span>
        <span>Lotería Mexicana</span>
      </a>
      <nav class="auth-nav" aria-label="Acceso">
        <a href="{{ url_for('auth.login') }}" class="nav-link">Iniciar sesión</a>
        <a href="{{ url_for('auth.registro') }}" class="nav-link nav-link-accent">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="auth-container auth-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="auth-footer">
    <div class="auth-container">
      <p>Lotería Mexicana en línea · Autenticación de usuarios</p>
    </div>
  </footer>
</body>
</html>
