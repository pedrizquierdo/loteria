name: CI - Pruebas unitarias

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: loteria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d loteria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@localhost:5432/loteria_test
      SECRET_KEY: clave-solo-para-ci

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -v